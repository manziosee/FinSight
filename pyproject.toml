[project]
name = "finsight"
version = "0.1.0"
description = "FinSight — AI-powered financial intelligence API platform"
requires-python = ">=3.12"
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "testcontainers>=4.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
finsight-common = { workspace = true }

# ---------------------------------------------------------------------------
# Shared tooling configuration (applies to every workspace member)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is fine
    "B008",   # FastAPI Depends() in argument defaults is the intended pattern
    "S104",   # binding 0.0.0.0 is intentional inside containers
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B008", "E501"]
"**/migrations/**" = ["ALL"]
"services/*/src/*/main.py" = ["B008"]
# Local-dev default credentials live in config.py; real values come from env/secrets.
"**/config.py" = ["S105", "S106", "RUF012"]
"**/.env.example" = ["ALL"]
"libs/finsight-common/src/finsight_common/auth.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["finsight_common"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["migrations/", "build/", "dist/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
testpaths = ["libs", "services"]
markers = [
  "integration: tests that require external services (docker/testcontainers)",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
