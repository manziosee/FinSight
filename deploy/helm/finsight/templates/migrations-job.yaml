{{- /*
Pre-install/pre-upgrade hooks, in weight order:
  -20  ExternalSecrets the hooks read. Hooks run before the release's normal resources
       exist, so the Jobs can't use the service ExternalSecrets. These are hooks too, kept
       until the next upgrade (before-hook-creation): deleting one right after creation
       would also delete its Secret before the Job reads it. A Job pod simply waits until
       ESO has synced its Secret.
  -10  db-bootstrap: create each service's login role + database (idempotent).
   -5  alembic migrations, one Job per database-owning service.
*/ -}}
{{- if .Values.migrations.enabled }}
{{- $g := .Values.global -}}
{{- $m := .Values.migrations -}}
{{- $tag := required "global.image.tag is required" $g.image.tag -}}
{{- $hookSecurity := dict "runAsNonRoot" true "runAsUser" 10001 "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $containerSecurity := dict "readOnlyRootFilesystem" true "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) -}}

{{- $hookSecrets := list -}}
{{- if $m.dbBootstrap }}{{- $hookSecrets = append $hookSecrets "db-bootstrap" -}}{{- end }}
{{- range $m.services }}{{- $hookSecrets = append $hookSecrets . -}}{{- end }}
{{- range $hookSecrets }}
---
apiVersion: {{ $g.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ . }}-hook
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ $g.secretStore }}, kind: ClusterSecretStore}
  target: {name: {{ . }}-hook, creationPolicy: Owner}
  dataFrom:
    - extract: {key: finsight/{{ $g.env }}/{{ . }}}
{{- end }}

{{- if $m.dbBootstrap }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap-{{ $.Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{ toYaml (dict "runAsNonRoot" true "runAsUser" 70 "seccompProfile" (dict "type" "RuntimeDefault")) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ $m.bootstrapImage }}
          securityContext: {{ toYaml $containerSecurity | nindent 12 }}
          envFrom:
            - secretRef: {name: db-bootstrap-hook}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # For each service database: login role (password from Secrets Manager, kept in
              # sync on every run), database owned by it, no CONNECT for anyone else.
              for db in $FINSIGHT_DB_NAMES; do
                role="${db}_svc"
                pw_var="FINSIGHT_DB_PASSWORD_$(echo "$db" | tr '[:lower:]' '[:upper:]')"
                eval pw="\$$pw_var"
                psql "$FINSIGHT_DB_ADMIN_DSN" -v ON_ERROR_STOP=1 -q \
                  -v db="$db" -v role="$role" -v pw="$pw" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'role')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
              ALTER ROLE :"role" WITH LOGIN PASSWORD :'pw';
              -- RDS's master user isn't a superuser: it must be a member to hand over ownership.
              GRANT :"role" TO CURRENT_USER;
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \gexec
              REVOKE CONNECT ON DATABASE :"db" FROM PUBLIC;
              GRANT CONNECT ON DATABASE :"db" TO :"role";
              SQL
                echo "bootstrapped $db"
              done
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}

{{- range $m.services }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ . }}-{{ $.Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{ toYaml $hookSecurity | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ $g.image.registry }}/finsight/{{ . }}:{{ $tag }}"
          securityContext: {{ toYaml $containerSecurity | nindent 12 }}
          # alembic.ini lives with the service, not at the image's /app root.
          command: ["alembic", "-c", "services/{{ . }}/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef: {name: {{ . }}-hook}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}
{{- end }}
