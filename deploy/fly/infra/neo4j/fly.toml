# finsight-neo4j — Neo4j Community (the financial graph). PRIVATE: no public IPs and no
# [http_service]; graph-service connects to bolt://finsight-neo4j.internal:7687.
# NEO4J_AUTH ("neo4j/<password>") is a Fly secret set by set-secrets.sh.
#   fly deploy deploy/fly/infra/neo4j --config deploy/fly/infra/neo4j/fly.toml --ha=false
app = "finsight-neo4j"
primary_region = "jnb"

[build]
  # Dockerfile only to pin the image by digest (Fly's `image =` rejects tag@digest).
  dockerfile = "Dockerfile"

[env]
  # Fly private networking is IPv6: listen on all v4+v6 addresses.
  NEO4J_server_default__listen__address = "::"
  NEO4J_server_default__advertised__address = "finsight-neo4j.internal"
  NEO4J_server_memory_heap_initial__size = "384m"
  NEO4J_server_memory_heap_max__size = "384m"
  NEO4J_server_memory_pagecache_size = "256m"
  # Browser/HTTP API not needed in production; bolt only.
  NEO4J_server_http_enabled = "false"

[[mounts]]
  source = "neo4j_data"
  destination = "/data"

[checks]
  [checks.bolt]
    type = "tcp"
    port = 7687
    interval = "15s"
    timeout = "3s"
    grace_period = "60s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
