# fly.toml — finsight-normalization-service. Deploy from the REPO ROOT:
#   fly deploy --config deploy/fly/normalization-service.toml --remote-only
app = "finsight-normalization-service"
primary_region = "jnb"

[build]
  dockerfile = "../../Dockerfile"  # relative to this file: the repo-root Dockerfile

[deploy]
  release_command = "alembic -c services/normalization-service/alembic.ini upgrade head"

[build.args]
  SERVICE = "normalization-service"

[env]
  FINSIGHT_ENV = "production"
  FINSIGHT_LOG_LEVEL = "INFO"
  FINSIGHT_SERVICE = "normalization-service"
  # Fly private networking (*.internal) is IPv6: bind dual-stack.
  UVICORN_HOST = "::"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
