apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finsight
resources:
  - ../../base
# The service workloads are deployed by the Helm chart (deploy/helm/finsight).
# This overlay owns cluster-scoped prerequisites and env-specific config.
helmCharts:
  - name: finsight
    path: ../../../helm/finsight
    releaseName: finsight
    namespace: finsight
    valuesFile: ../../../helm/finsight/values-staging.yaml
