# fly.toml — finsight-console. Self-contained (own Dockerfile + build context),
# unlike the Python services under deploy/fly/. Deploy from THIS directory:
#   cd console && fly deploy
app = "finsight-console"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # The gateway's PUBLIC url — baked into the client bundle at build time.
  NEXT_PUBLIC_FINSIGHT_API_URL = "https://finsight-api-gateway.fly.dev"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
