# fly.toml — finsight-frontend (TanStack Start). Self-contained build context. Deploy:
#   cd frontend && fly apps create finsight-frontend && fly deploy --ha=false
app = "finsight-frontend"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # Server-side calls go to the gateway's public hostname (the one it trusts).
  FINSIGHT_API_URL = "https://finsight-api-gateway.fly.dev"
  FINSIGHT_PUBLIC_API_URL = "https://finsight-api-gateway.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/healthz"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
