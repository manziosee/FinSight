name: finsight

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  restart: unless-stopped
  networks: [finsight]

x-python-env: &python-env
  FINSIGHT_ENV: local
  FINSIGHT_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  FINSIGHT_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  FINSIGHT_REDIS_URL: redis://redis:6379/0
  FINSIGHT_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
  FINSIGHT_JWT_ISSUER: https://identity.finsight.local
  FINSIGHT_JWT_AUDIENCE: finsight-api

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_local_pw
      POSTGRES_MULTIPLE_DATABASES: identity,ingestion,normalization,reconciliation
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sh:/docker-entrypoint-initdb.d/00-multi-db.sh:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [finsight]

  neo4j:
    image: neo4j:5.22-community
    environment:
      NEO4J_AUTH: neo4j/finsight_local_pw
      NEO4J_PLUGINS: '["apoc"]'
    expose: ["7474", "7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [finsight]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose: ["6379"]
    networks: [finsight]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [finsight]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["18082:8080"]
    depends_on: [redpanda]
    networks: [finsight]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: finsight
      MINIO_ROOT_PASSWORD: finsight_local_pw
    ports: ["19001:9001"]
    expose: ["9000"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [finsight]

  minio-setup:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 finsight finsight_local_pw &&
      mc mb --ignore-existing local/finsight-raw-data &&
      mc version enable local/finsight-raw-data || true
      "
    networks: [finsight]

  # ---------------- observability ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ["4317", "4318"]
    depends_on: [jaeger]
    networks: [finsight]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    networks: [finsight]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose: ["9090"]
    networks: [finsight]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["13000:3000"]
    depends_on: [prometheus]
    networks: [finsight]

  # ---------------- edge ----------------
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["8088:80", "8090:8080"]
    volumes:
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on: [api-gateway]
    networks: [finsight]

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URLS: '[{"url":"/openapi/finsight.openapi.json","name":"FinSight API (aggregated)"}]'
    volumes:
      - ./docs/api:/usr/share/nginx/html/openapi:ro
    ports: ["18081:8080"]
    networks: [finsight]

  # ---------------- FinSight services ----------------
  identity-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: identity-service}}
    environment:
      <<: *python-env
      FINSIGHT_IDENTITY_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/identity
    depends_on:
      postgres: {condition: service_healthy}
    expose: ["8000"]

  ingestion-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: ingestion-service}}
    environment:
      <<: *python-env
      FINSIGHT_INGESTION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/ingestion
      FINSIGHT_S3_ENDPOINT_URL: http://minio:9000
      FINSIGHT_S3_ACCESS_KEY_ID: finsight
      FINSIGHT_S3_SECRET_ACCESS_KEY: finsight_local_pw
      FINSIGHT_S3_RAW_BUCKET: finsight-raw-data
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      minio-setup: {condition: service_completed_successfully}
    expose: ["8000"]

  normalization-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: normalization-service}}
    environment:
      <<: *python-env
      FINSIGHT_NORMALIZATION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/normalization
      FINSIGHT_S3_ENDPOINT_URL: http://minio:9000
      FINSIGHT_S3_ACCESS_KEY_ID: finsight
      FINSIGHT_S3_SECRET_ACCESS_KEY: finsight_local_pw
      FINSIGHT_S3_RAW_BUCKET: finsight-raw-data
    depends_on:
      redpanda: {condition: service_healthy}
      minio-setup: {condition: service_completed_successfully}
    expose: ["8000"]

  graph-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: graph-service}}
    environment:
      <<: *python-env
      FINSIGHT_NEO4J_URI: bolt://neo4j:7687
      FINSIGHT_NEO4J_USER: neo4j
      FINSIGHT_NEO4J_PASSWORD: finsight_local_pw
    depends_on:
      neo4j: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    expose: ["8000"]

  reconciliation-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: reconciliation-service}}
    environment:
      <<: *python-env
      FINSIGHT_RECONCILIATION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/reconciliation
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    expose: ["8000"]

  intelligence-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: intelligence-service}}
    environment:
      <<: *python-env
      FINSIGHT_LLM_PROVIDER: ${FINSIGHT_LLM_PROVIDER:-anthropic}
      FINSIGHT_LLM_MODEL: ${FINSIGHT_LLM_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose: ["8000"]

  anomaly-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: anomaly-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  forecast-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: forecast-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  action-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: action-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  api-gateway:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: api-gateway}}
    environment:
      <<: *python-env
      FINSIGHT_TRUSTED_HOSTS: '["*"]'
    depends_on:
      - identity-service
      - ingestion-service
      - normalization-service
      - graph-service
      - reconciliation-service
    ports: ["18000:8000"]

networks:
  finsight: {}

volumes:
  pgdata: {}
  neo4jdata: {}
  miniodata: {}
