name: finsight

# Host-published ports bind to FINSIGHT_BIND_ADDR (default 127.0.0.1) so the dev stack and
# its admin UIs aren't reachable from the LAN (Docker port publishing bypasses host
# firewalls). Set FINSIGHT_BIND_ADDR=0.0.0.0 in .env to deliberately expose them.
#
# Secrets are interpolated from .env by Compose itself, and each container receives only
# the variables listed for it — there is no blanket env_file, so a compromised service
# can't read every other service's credentials. Run `make bootstrap` to generate them.

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [finsight]

x-python-env: &python-env
  FINSIGHT_ENV: local
  FINSIGHT_LOG_LEVEL: ${FINSIGHT_LOG_LEVEL:-INFO}
  FINSIGHT_DEFAULT_CURRENCY: ${FINSIGHT_DEFAULT_CURRENCY:-XXX}
  FINSIGHT_DEFAULT_TIMEZONE: ${FINSIGHT_DEFAULT_TIMEZONE:-UTC}
  FINSIGHT_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  FINSIGHT_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  FINSIGHT_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
  FINSIGHT_JWT_ISSUER: https://identity.finsight.local
  FINSIGHT_JWT_AUDIENCE: finsight-api

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_local_pw
      POSTGRES_MULTIPLE_DATABASES: identity,ingestion,normalization,reconciliation
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sh:/docker-entrypoint-initdb.d/00-multi-db.sh:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [finsight]

  neo4j:
    image: neo4j:5.22-community
    environment:
      NEO4J_AUTH: neo4j/finsight_local_pw
      NEO4J_PLUGINS: '["apoc"]'
    expose: ["7474", "7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [finsight]

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is unset - run make bootstrap}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [finsight]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [finsight]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:18082:8080"]
    depends_on:
      redpanda: {condition: service_healthy}
    networks: [finsight]

  # S3-compatible object store (stands in for AWS S3 / Tigris). SeaweedFS replaced MinIO,
  # whose container images are no longer published. Access keys are enforced via the
  # identities file; ingestion-service creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3data:/data
      - ./infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    expose: ["8333"]
    # Filer web UI for browsing uploaded objects (no auth: localhost only).
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:19001:8888"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [finsight]

  # ---------------- observability ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ["4317", "4318"]
    depends_on:
      jaeger: {condition: service_started}
    networks: [finsight]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:16686:16686"]
    networks: [finsight]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose: ["9090"]
    networks: [finsight]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is unset - run make bootstrap}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:13000:3000"]
    depends_on:
      prometheus: {condition: service_started}
    networks: [finsight]

  # ---------------- edge ----------------
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      # No --api.insecure: it serves Traefik's unauthenticated API/dashboard on its own port.
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:8088:80"]
    volumes:
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      api-gateway: {condition: service_healthy}
    networks: [finsight]

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URLS: '[{"url":"/openapi/finsight.openapi.json","name":"FinSight API (aggregated)"}]'
    volumes:
      - ./docs/api:/usr/share/nginx/html/openapi:ro
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:18081:8080"]
    networks: [finsight]

  # ---------------- FinSight services ----------------
  identity-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: identity-service}}
    environment:
      <<: *python-env
      FINSIGHT_IDENTITY_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/identity
      FINSIGHT_SEED_CLIENT_ID: ${FINSIGHT_SEED_CLIENT_ID:-}
      FINSIGHT_SEED_CLIENT_SECRET: ${FINSIGHT_SEED_CLIENT_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    expose: ["8000"]

  ingestion-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: ingestion-service}}
    environment:
      <<: *python-env
      FINSIGHT_INGESTION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/ingestion
      FINSIGHT_S3_ENDPOINT_URL: http://s3:8333
      FINSIGHT_S3_ACCESS_KEY_ID: finsight
      FINSIGHT_S3_SECRET_ACCESS_KEY: finsight_local_pw
      FINSIGHT_S3_RAW_BUCKET: finsight-raw-data
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      s3: {condition: service_healthy}
    expose: ["8000"]

  normalization-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: normalization-service}}
    environment:
      <<: *python-env
      FINSIGHT_NORMALIZATION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/normalization
      FINSIGHT_S3_ENDPOINT_URL: http://s3:8333
      FINSIGHT_S3_ACCESS_KEY_ID: finsight
      FINSIGHT_S3_SECRET_ACCESS_KEY: finsight_local_pw
      FINSIGHT_S3_RAW_BUCKET: finsight-raw-data
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      s3: {condition: service_healthy}
    expose: ["8000"]

  graph-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: graph-service}}
    environment:
      <<: *python-env
      FINSIGHT_NEO4J_URI: bolt://neo4j:7687
      FINSIGHT_NEO4J_USER: neo4j
      FINSIGHT_NEO4J_PASSWORD: finsight_local_pw
    depends_on:
      neo4j: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    expose: ["8000"]

  reconciliation-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: reconciliation-service}}
    environment:
      <<: *python-env
      FINSIGHT_RECONCILIATION_DB_DSN: postgresql+asyncpg://finsight:finsight_local_pw@postgres:5432/reconciliation
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    expose: ["8000"]

  intelligence-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: intelligence-service}}
    environment:
      <<: *python-env
      FINSIGHT_LLM_PROVIDER: ${FINSIGHT_LLM_PROVIDER:-anthropic}
      FINSIGHT_LLM_MODEL: ${FINSIGHT_LLM_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose: ["8000"]

  anomaly-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: anomaly-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  forecast-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: forecast-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  action-service:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: action-service}}
    environment: {<<: *python-env}
    expose: ["8000"]

  api-gateway:
    <<: *service-base
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: api-gateway}}
    environment:
      <<: *python-env
      FINSIGHT_TRUSTED_HOSTS: '["*"]'
      # The console (http://localhost:3300) calls the gateway cross-origin via Traefik.
      FINSIGHT_CORS_ALLOW_ORIGINS: '["http://localhost:3300"]'
      FINSIGHT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      ingestion-service: {condition: service_healthy}
      normalization-service: {condition: service_healthy}
      graph-service: {condition: service_healthy}
      reconciliation-service: {condition: service_healthy}
      intelligence-service: {condition: service_healthy}
      anomaly-service: {condition: service_healthy}
      forecast-service: {condition: service_healthy}
      action-service: {condition: service_healthy}
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:18000:8000"]

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
      args: {NEXT_PUBLIC_FINSIGHT_API_URL: "http://localhost:8088"}
    restart: unless-stopped
    depends_on:
      api-gateway: {condition: service_healthy}
    ports: ["${FINSIGHT_BIND_ADDR:-127.0.0.1}:3300:3000"]
    networks: [finsight]

networks:
  finsight: {}

volumes:
  pgdata: {}
  neo4jdata: {}
  s3data: {}
