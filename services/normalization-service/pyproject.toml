[project]
name = "normalization-service"
version = "0.1.0"
description = "FinSight normalization: parse messy inputs into the Universal Financial Schema"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.20.1",
    "aioboto3>=13.0",
    "openpyxl>=3.1",
    "pypdf>=7.0.0",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalization_service"]
