[project]
name = "identity-service"
version = "0.1.0"
description = "FinSight identity: tenants, OAuth2 clients, API keys, JWT issuance"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.19.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
