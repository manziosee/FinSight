[project]
name = "reconciliation-service"
version = "0.1.0"
description = "FinSight reconciliation: match payments to invoices/bank/ledger with confidence"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconciliation_service"]
