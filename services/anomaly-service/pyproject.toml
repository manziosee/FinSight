[project]
name = "anomaly-service"
version = "0.1.0"
description = "FinSight anomaly detection: rule + statistical checks over financial records"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_service"]
