[project]
name = "action-service"
version = "0.1.0"
description = "FinSight action layer: approval-gated execution and the AI-agent tool surface"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_service"]
