[project]
name = "api-gateway"
version = "0.1.0"
description = "FinSight API gateway: auth, routing, unified OpenAPI"
requires-python = ">=3.12"
dependencies = ["finsight-common", "uvicorn[standard]>=0.53.0", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
