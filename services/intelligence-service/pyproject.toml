[project]
name = "intelligence-service"
version = "0.1.0"
description = "FinSight intelligence: understand / explain / ask, with bring-your-own-AI providers"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.52.4",
    "anthropic>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_service"]
