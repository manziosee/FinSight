[project]
name = "ingestion-service"
version = "0.1.0"
description = "FinSight ingestion: accept raw financial data, land it in object storage"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.52.4",
    "alembic>=1.20.1",
    "aioboto3>=13.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_service"]
