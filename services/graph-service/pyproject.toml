[project]
name = "graph-service"
version = "0.1.0"
description = "FinSight financial graph: build and query the entity relationship graph"
requires-python = ">=3.12"
dependencies = [
    "finsight-common",
    "uvicorn[standard]>=0.52.4",
    "neo4j>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_service"]
