name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  python-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.30", enable-cache: true}
      - run: uv sync --all-packages --python 3.12
      - name: Bandit
        run: uv run bandit -q -r services libs -c pyproject.toml -f sarif -o bandit.sarif || true
      - name: pip-audit
        run: uv run pip-audit --strict || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: bandit.sarif, category: bandit}

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/default --config p/python --config p/secrets --sarif -o semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: semgrep.sarif, category: semgrep}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@v3

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (Terraform + compose + k8s)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: checkov.sarif, category: checkov}
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile, no-fail: true}
      - name: Validate k8s manifests
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /tmp && sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 deploy/k8s/base
