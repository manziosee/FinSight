name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  python-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.30", enable-cache: true}
      - run: uv sync --all-packages --python 3.12
      - name: Bandit
        run: uv run bandit -q -r services libs -c pyproject.toml || true
      - name: pip-audit
        run: uv run pip-audit || true

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (report only)
        run: semgrep scan --config p/default --config p/python --config p/secrets --error --sarif --output semgrep.sarif || true
      - name: Upload Semgrep SARIF
        if: ${{ hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with: {sarif_file: semgrep.sarif, category: semgrep}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov (report only)
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: deploy
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload Checkov SARIF
        if: ${{ hashFiles('checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with: {sarif_file: checkov.sarif, category: checkov}
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile, no-fail: true}
      - name: Validate k8s manifests
        run: |
          VER=0.6.7
          curl -sSLo /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/v${VER}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tgz -C /tmp
          /tmp/kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.30.0 deploy/k8s/base || true
