name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.30"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-packages --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy libs services || true  # non-blocking until fully typed

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --all-packages --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest -m "not integration" --cov --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv lock --check
      - run: uv sync --all-packages --frozen --python ${{ env.PYTHON_VERSION }}
      - run: ./scripts/gen-openapi.sh
      - name: Fail if committed API specs are stale
        run: git diff --exit-code -- docs/api
      - name: Lint the API spec
        run: npx --yes @stoplight/spectral-cli lint docs/api/finsight.openapi.json --ruleset .spectral.yaml

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_FINSIGHT_API_URL: https://finsight-api-gateway.fly.dev

  build-images:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - ingestion-service
          - normalization-service
          - graph-service
          - reconciliation-service
          - intelligence-service
          - anomaly-service
          - forecast-service
          - action-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: finsight/${{ matrix.service }}:ci
          load: true
          provenance: false
      # Image vulnerability scanning runs in the Security workflow (image-scan job),
      # kept out of the build gate so a CVE feed hiccup never blocks a merge.

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap env
        run: |
          cp .env.example .env
          python -c "from cryptography.fernet import Fernet;import pathlib,re;p=pathlib.Path('.env');p.write_text(re.sub(r'^FINSIGHT_FIELD_ENCRYPTION_KEY=.*', 'FINSIGHT_FIELD_ENCRYPTION_KEY='+Fernet.generate_key().decode(), p.read_text(), flags=re.M))"
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Tear down
        if: always()
        run: docker compose down -v
