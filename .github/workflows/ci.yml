name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.30"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy libs services || true  # non-blocking until fully typed

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest -m "not integration" --cov --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", enable-cache: true}
      - run: uv sync --all-packages --python ${{ env.PYTHON_VERSION }}
      - run: ./scripts/gen-openapi.sh
      - name: Fail if the committed spec is stale
        run: git diff --exit-code docs/api/finsight.openapi.json
      - name: Lint the API spec
        run: npx --yes @stoplight/spectral-cli lint docs/api/finsight.openapi.json --ruleset .spectral.yaml || true

  build-images:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - ingestion-service
          - normalization-service
          - graph-service
          - reconciliation-service
          - intelligence-service
          - anomaly-service
          - forecast-service
          - action-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: finsight/${{ matrix.service }}:ci
          load: true
          provenance: false
      - name: Trivy scan (report only)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v0.56.2
          "$RUNNER_TEMP/bin/trivy" image --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            --format table "finsight/${{ matrix.service }}:ci" || true

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap env
        run: |
          cp .env.example .env
          python -c "from cryptography.fernet import Fernet;import pathlib,re;p=pathlib.Path('.env');p.write_text(re.sub(r'^FINSIGHT_FIELD_ENCRYPTION_KEY=.*', 'FINSIGHT_FIELD_ENCRYPTION_KEY='+Fernet.generate_key().decode(), p.read_text(), flags=re.M))"
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Tear down
        if: always()
        run: docker compose down -v
