name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "enabled=false" >> "$GITHUB_OUTPUT";
               echo "::notice::Fly deploy skipped — add the FLY_API_TOKEN secret to enable."; fi

  deploy:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    strategy:
      max-parallel: 3
      matrix:
        service:
          - identity-service
          - ingestion-service
          - normalization-service
          - graph-service
          - reconciliation-service
          - intelligence-service
          - anomaly-service
          - forecast-service
          - action-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config deploy/fly/${{ matrix.service }}.toml --remote-only --wait-timeout 600
