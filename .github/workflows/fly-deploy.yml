name: Fly Deploy

# Deploys only code that passed CI: runs after the CI workflow succeeds on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "enabled=false" >> "$GITHUB_OUTPUT";
               echo "::notice::Fly deploy skipped — add the FLY_API_TOKEN secret to enable."; fi

  deploy:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    strategy:
      max-parallel: 3
      matrix:
        service:
          - identity-service
          - ingestion-service
          - normalization-service
          - graph-service
          - reconciliation-service
          - intelligence-service
          - anomaly-service
          - forecast-service
          - action-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit CI tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy ${{ matrix.service }}
        run: |
          # Only the gateway is public; never let a deploy allocate IPs for internal apps.
          EXTRA=""
          [ "${{ matrix.service }}" = "api-gateway" ] || EXTRA="--no-public-ips"
          flyctl deploy . --config "$PWD/deploy/fly/${{ matrix.service }}.toml" \
            --remote-only --ha=false --wait-timeout 600 $EXTRA
