name: API Docs

# GitHub Pages must be enabled first: repo Settings → Pages → Source: "GitHub Actions".
# Until then this only runs on demand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.30", enable-cache: true}
      - run: uv sync --all-packages --python 3.12
      - run: ./scripts/gen-openapi.sh
      - name: Build Redoc static site
        run: |
          mkdir -p site
          cp docs/api/finsight.openapi.json site/openapi.json
          npx --yes @redocly/cli build-docs site/openapi.json -o site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
