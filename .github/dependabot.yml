version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: {interval: "weekly"}
    groups:
      python-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
  - package-ecosystem: "docker"
    directory: "/"
    schedule: {interval: "weekly"}
  - package-ecosystem: "docker"
    directory: "/console"
    schedule: {interval: "weekly"}
  - package-ecosystem: "terraform"
    directory: "/deploy/terraform"
    schedule: {interval: "weekly"}
